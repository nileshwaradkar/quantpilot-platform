services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: quantpilot
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: quantpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:

